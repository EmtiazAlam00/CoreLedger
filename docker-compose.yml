services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: coreledger
      POSTGRES_PASSWORD: coreledger
      POSTGRES_DB: coreledger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coreledger"]
      interval: 3s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two listeners: PLAINTEXT for host-run processes (pytest, scripts,
      # `uv run` dev loop) reaching in via localhost:9092, INTERNAL for
      # other containers on the compose network reaching in via
      # kafka:29092. A single listener can't serve both — whichever
      # hostname is advertised is where a client reconnects after the
      # initial bootstrap, and "localhost" means something different
      # inside a container than it does on the host.
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    # Runs migrations before serving — fine for a single-instance portfolio
    # deployment; a real multi-instance rollout would run this as a
    # separate one-off job instead of racing N container startups against it.
    command: sh -c "alembic upgrade head && uvicorn coreledger.api.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    environment:
      DATABASE_URL: postgresql+psycopg://coreledger:coreledger@postgres:5432/coreledger
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  ledger_writer:
    build: .
    command: python -m coreledger.ledger_writer.consumer
    environment:
      DATABASE_URL: postgresql+psycopg://coreledger:coreledger@postgres:5432/coreledger
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      api:
        condition: service_started  # only so migrations (run by api) land first

  nginx:
    image: nginx:1.27
    ports:
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api

volumes:
  postgres_data:
