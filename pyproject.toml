[project]
name = "coreledger"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "emtiaz3@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "authlib>=1.7.2",
    "confluent-kafka>=2.15.0",
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "joserfc>=1.7.4",
    "plaid-python>=43.0.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
coreledger = "coreledger:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
