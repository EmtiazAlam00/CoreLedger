events {}

http {
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Require and verify a client certificate signed by our dev CA —
        # this is the mTLS half of FAPI 2.0 client authentication.
        ssl_client_certificate /etc/nginx/certs/ca.crt;
        ssl_verify_client on;

        location / {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            # Tells the app (via uvicorn --proxy-headers) that the
            # client-facing connection is HTTPS, even though this hop to
            # uvicorn is plain HTTP — otherwise request.url reports http://
            # and Authlib's OAuth2 insecure-transport check correctly (but
            # wrongly, from the client's perspective) rejects it.
            proxy_set_header X-Forwarded-Proto https;
            # Forward the verified client identity to the API. FastAPI
            # trusts these headers because, in this setup, nginx is the
            # only path to it that terminates TLS — see the note in
            # api/auth.py about the direct-to-:8000 bypass this implies.
            proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
            proxy_set_header X-SSL-Client-DN $ssl_client_s_dn;
        }
    }
}
